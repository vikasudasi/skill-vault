[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-vault"
version = "0.1.0"
description = "Self-hostable MCP skill registry for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vik Udasi", email = "vikasudasi@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]
keywords = ["mcp", "skills", "ai", "agents", "registry", "semantic-search", "llm"]
dependencies = [
  "fastmcp",
  "fastapi",
  "jinja2",
  "python-multipart",
  "uvicorn[standard]",
  "sqlite-vec",
  "sentence-transformers",
  "pydantic-settings",
  "click",
  "rich",
  "cryptography",
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/vikasudasi/skill-vault"
Repository = "https://github.com/vikasudasi/skill-vault"
Documentation = "https://github.com/vikasudasi/skill-vault#readme"
Issues = "https://github.com/vikasudasi/skill-vault/issues"
Changelog = "https://github.com/vikasudasi/skill-vault/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "httpx",
]

[project.scripts]
skill-vault = "skill_vault.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_vault*"]

[tool.setuptools.package-data]

"skill_vault.web" = ["templates/*.html", "static/*.css", "static/*.js"]
"skill_vault.data" = ["skills/*/SKILL.md", "skills/*/references/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["skill_vault/data/", "scripts/", ".filegen_bodies/", ".filegen_manifest/"]

[tool.mypy]
python_version = "3.11"
exclude = ["skill_vault/data/", "scripts/"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
