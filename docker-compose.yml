services:
  mcp:
    build:
      context: .
    entrypoint: ["skill-vault", "serve", "--transport", "streamable-http"]
    environment:
      SKILL_VAULT_DB_PATH: /data/skill_vault.db
      SKILL_VAULT_VECTOR_BACKEND: sqlite_vec
      SKILL_VAULT_MCP_HOST: 0.0.0.0
      SKILL_VAULT_MCP_PORT: 8000
      SKILL_VAULT_WEB_HOST: 0.0.0.0
      SKILL_VAULT_WEB_PORT: 8080
      SKILL_VAULT_ADMIN_USERNAME: admin
      SKILL_VAULT_ADMIN_PASSWORD: change-me
      SKILL_VAULT_SEED_DIR: /data/skills
    volumes:
      - skillvault-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
    entrypoint: ["skill-vault", "web"]
    environment:
      SKILL_VAULT_DB_PATH: /data/skill_vault.db
      SKILL_VAULT_VECTOR_BACKEND: sqlite_vec
      SKILL_VAULT_MCP_HOST: 0.0.0.0
      SKILL_VAULT_MCP_PORT: 8000
      SKILL_VAULT_WEB_HOST: 0.0.0.0
      SKILL_VAULT_WEB_PORT: 8080
      SKILL_VAULT_ADMIN_USERNAME: admin
      SKILL_VAULT_ADMIN_PASSWORD: change-me
      SKILL_VAULT_SEED_DIR: /data/skills
    volumes:
      - skillvault-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  skillvault-data:
