{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="panel">
  <h2>{{ title }}</h2>
  <form method="post" action="{{ action_url }}" class="stack">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ skill.name if skill else '' }}" required />

    <label for="description">Description</label>
    <input id="description" name="description" value="{{ skill.description if skill else '' }}" required />

    <label for="tags">Tags (comma-separated)</label>
    <input id="tags" name="tags" value="{{ tags }}" />

    <label for="triggers">Triggers (comma-separated)</label>
    <input id="triggers" name="triggers" value="{{ triggers }}" />

    <label for="body">Body</label>
    <textarea id="body" name="body" rows="12" required>{{ skill.body if skill else '' }}</textarea>

    <fieldset>
      <legend>Visibility</legend>
      <label><input type="radio" name="visibility" value="personal" {% if visibility == "personal" %}checked{% endif %} {% if mode == "edit" %}disabled{% endif %} /> Personal</label>
      <label><input type="radio" name="visibility" value="team" {% if visibility == "team" %}checked{% endif %} {% if mode == "edit" %}disabled{% endif %} /> Team</label>
      <label><input type="radio" name="visibility" value="global" {% if visibility == "global" %}checked{% endif %} {% if mode == "edit" %}disabled{% endif %} /> Global</label>
    </fieldset>

    <button type="submit">{{ submit_label }}</button>
  </form>
</section>
{% endblock %}
