<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Skill Vault Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='skillvault.css') }}" />
    <script defer src="{{ url_for('static', path='skillvault.js') }}"></script>
  </head>
  <body>
    <header class="page-header public-header">
      <div class="container public-nav">
        <p class="brand"><a href="/">Skill Vault</a></p>
        <nav>
          <a href="/browse">Global browse</a>
          {% if request.state.user %}
          <a href="/dashboard">Dashboard</a>
          <a href="/dashboard/onboard">Onboard agent</a>
          <span class="muted">{{ request.state.user["email"] }}</span>
          <form method="post" action="/logout" class="inline">
            <button type="submit">Logout</button>
          </form>
          {% else %}
          <a href="/login">Login</a>
          <a href="/signup">Sign up</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
